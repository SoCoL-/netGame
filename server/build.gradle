// "server" — headless-приложение (без gdx-backend, без графики). Хранит
// авторитетную ECS-симуляцию, принимает команды от клиентов и рассылает
// снапшоты. Запуск: ./gradlew :server:run
// Java-версия уже настроена централизованно в корневом build.gradle.

plugins {
  id "application"
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
application.mainClass = 'ru.socol.supreme.server.GameServerMain'
eclipse.project.name = appName + '-server'

dependencies {
  implementation project(':shared')
}

// Собирает самодостаточный runnable jar (все зависимости — shared, ashley,
// kryonet, gdx-core — внутри одного файла): java -jar server.jar и всё,
// Gradle/IDE после сборки не нужны. Тот же приём, что уже настроен для
// lwjgl3 (там это называется client.jar) — просто без графических натиков,
// которые серверу не нужны.
jar {
  archiveFileName.set('server.jar')
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
  manifest {
    attributes 'Main-Class': application.mainClass
  }
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

// Юнит-тесты сервера (server/src/test) — GameServer и LobbyManager без
// настоящей сети: соединения подменяются FakeConnection, симуляция
// шагается вручную (GameServer.tick). Тот же JUnit 5, что и у core.
dependencies {
  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  // Gradle 9 больше не подкладывает JUnit Platform launcher сам — без
  // него test падает с "Failed to load JUnit Platform".
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
  // Те же units.json/buildings.json, что и у запущенного сервера (см. run
  // ниже); сами тесты от конкретных чисел баланса не зависят.
  workingDir = rootProject.file('assets')
}

// units.json и buildings.json ищутся в рабочей директории процесса (см.
// UnitDefinitions/BuildingDefinitions), а единственная их копия в
// репозитории лежит в assets/ — там же, откуда их читает клиент
// (lwjgl3/build.gradle). Так сервер и клиент гарантированно видят один и
// тот же баланс.
run {
  workingDir = rootProject.file('assets')
}
